# Standalone Qwen-Image MCP sidecar (no z-image-studio dependency).
#
#   docker compose up -d          # pull from GHCR + start (first run: ~19 GB model download on first generation)
#   curl http://127.0.0.1:8000/health
#
# open-webui (shared network openwebui_default):
#   MCP server URL: http://qwen-image:8000  (…/mcp works too — both paths are mounted)
services:
  qwen-image:
    # Built & pushed by GitHub Actions on every push to main (see .github/workflows/build-and-push.yml).
    # To update after a new build:  docker compose pull && docker compose up -d
    image: ghcr.io/ricsc/qwen-image-mcp:latest
    container_name: qwen-image
    # Port bound to localhost only (no LAN exposure); open-webui reaches the
    # service by container name on the shared Docker network.
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - openwebui_default
    environment:
      # Must be reachable from the MCP client's perspective:
      #   open-webui (in the Docker network)     -> http://qwen-image:8000 (container name)
      #   host-only usage (OpenCode/browser)     -> http://127.0.0.1:8000
      - IMAGE_BASE_URL=http://qwen-image:8000
      - IMAGE_DIR=/srv/images-qwen
      # Keep the HuggingFace model cache persistent (otherwise ~19 GB download on every start)
      - HF_HOME=/data/hf-cache
      # Prevents VRAM fragmentation (recommended by PyTorch when memory is tight)
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Lazy loading: the model is loaded on the first generate_image (~15-30 s),
      # then unloaded from the GPU after IDLE_UNLOAD_AFTER seconds of inactivity.
      - IDLE_UNLOAD_AFTER=300
      # Lightning distillation LoRA (lightx2v/Qwen-Image-2512-Lightning).
      # The step count is derived automatically from the filename:
      #   Qwen-Image-2512-Lightning-8steps-V1.0-bf16.safetensors   8 steps, ~20 s/render (default)
      #   Qwen-Image-2512-Lightning-4steps-V1.0-bf16.safetensors   4 steps, ~11 s/render
      - LORA_WEIGHT_NAME=Qwen-Image-2512-Lightning-8steps-V1.0-bf16.safetensors
      # Flow-match shift of the LoRA path (default 3.0 = Lightning distillation schedule).
      # Raise to 12-13 for blurry/weak outputs (unsloth's hint, aimed at their
      # 40-step workflow; for the 8-step LoRA it's a testing lever only).
      # LORA_STEPS: step count override (default: derived from the LoRA filename).
      # LORA_CFG: CFG scale of the LoRA path (default 1.0 = no CFG, as distilled;
      #   higher values deviate from the distillation recipe — test first).
      # Changes only take effect after:  docker compose up -d
      # - LORA_SHIFT=12
      # - LORA_STEPS=8
      # - LORA_CFG=2.0
    volumes:
      - ./data:/data          # HF model cache (~19 GB after first download)
      - ./images:/srv/images-qwen
    healthcheck:
      # Lazy loading: the service starts immediately (model on demand) -> /health returns 200 (idle)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  openwebui_default:
    external: true
